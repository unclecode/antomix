# Profile/Model shortcuts for $$set command
# Format: shortcut: "profile/model"
# Usage: $$set:gqw message → expands to $$set:groq/qwen/qwen3-32b message

shortcuts:

  # OpenAI shortcuts
  o3pro: "openai/o3-pro"
  o3: "openai/o3"
  o3mini: "openai/o3-mini"
  o4: "openai/o4-mini"
  gpt41: "openai/gpt-4.1"
  gpt41mini: "openai/gpt-4.1-mini"

  # Gemini shortcuts (direct API)
  gemini-flash: "gemini/gemini-2.5-flash"
  gemini-pro: "gemini/gemini-2.5-pro"

  # Cerebras shortcuts
  cerebras-coder: "cerebras/qwen-3-coder-480b"
  cerebras-qwen: "cerebras/qwen-3-235b-a22b-instruct-2507"

  # Anthropic shortcuts
  opus4: "openrouter-qwen/anthropic/claude-opus-4"
  sonnet4: "openrouter-qwen/anthropic/claude-sonnet-4"
  haiku35: "openrouter-qwen/anthropic/claude-3.5-haiku"

  # xAI shortcuts
  grok4: "openrouter-qwen/x-ai/grok-4"
  grok3: "openrouter-qwen/x-ai/grok-3"
  grok3mini: "openrouter-qwen/x-ai/grok-3-mini"

  # Longer format shortcuts (provider-model style)
  # Groq shortcuts
  groq-qwen: "groq/qwen/qwen3-32b"
  groq-kimi2: "groq/moonshotai/kimi-k2-instruct"
  groq-llama: "groq/llama-3.3-70b-versatile"
  groq-deepseek: "groq/deepseek-r1-distill-llama-70b"
  
  # OpenRouter shortcuts
  open-grok4: "openrouter-qwen/x-ai/grok-4"
  open-grok3: "openrouter-qwen/x-ai/grok-3"
  open-qwen: "openrouter-qwen/qwen/qwen3-235b-a22b-2507"
  open-qwen-coder: "openrouter-qwen/qwen/qwen3-coder"
  open-kimi2: "openrouter-qwen/moonshotai/kimi-k2"
  open-geminipro: "openrouter-qwen/google/gemini-2.5-pro"
  open-geminiflash: "openrouter-qwen/google/gemini-2.5-flash"
  open-devstral: "openrouter-qwen/mistralai/devstral-medium"
  open-mistral: "openrouter-qwen/mistralai/mistral-medium-3"
  open-codestral: "openrouter-qwen/mistralai/codestral-2501"

# Collaborative model sets for $$colab command
colab_sets:
  think:
    models: "o3,open-qwen,groq-deepseek,open-geminipro"
    suffix: "\n\n[Note: This requires deep thinking and reasoning. Please provide step-by-step analysis, consider multiple perspectives, and explain your reasoning thoroughly.]"
  code:
    models: "o3,gpt41,open-qwen-coder,open-codestral,sonnet4"
    suffix: "\n\n[Note: This is a coding-related query. Focus on code quality, best practices, performance, and maintainability. Provide code examples where relevant.]"
  docs:
    models: "gpt41,open-geminipro,open-mistral,haiku35"
    suffix: "\n\n[Note: This is for documentation purposes. Focus on clarity, completeness, proper formatting, and helpful examples. Make it user-friendly and well-structured.]"

# Add your custom shortcuts above
