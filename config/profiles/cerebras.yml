name: "Anthropic → Cerebras"
description: "Uses Cerebras AI for ultra-fast inference with large models"

# Model mappings
models:
  "claude-3-5-haiku-20241022": 
    - "llama3.1-8b"
  "claude-sonnet-4-20250514": 
    - "qwen-3-coder-480b"
  "claude-opus-4-20250514": 
    - "qwen-3-235b-a22b-instruct-2507"

# Claude code specific details
claude:
  fast_model: "claude-3-5-haiku-20241022"

# Parameter transformations for Cerebras models
parameters:
  "*":  # All Cerebras models
    "[max_tokens]": "max_completion_tokens"  # Rename parameter
    "max_completion_tokens": 8192  # Set default limit

# API configuration
api:
  base_url: "https://api.cerebras.ai"
  api_key: "$CEREBRAS_API_KEY"
  headers:
    # Custom headers if needed