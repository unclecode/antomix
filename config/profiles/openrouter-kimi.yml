name: "Anthropic → OpenRouter (OpenAI)"
description: "Route Anthropic requests to OpenAI models via OpenRouter"

# Model mappings
models:
  "claude-3-5-haiku-20241022": 
    - "openai/gpt-4.1-mini"
  "claude-opus-4-20250514": 
    - "moonshotai/kimi-k2"
  "claude-sonnet-4-20250514": 
    - "moonshotai/kimi-k2"

# Claude code specific details
claude:
  fast_model: "claude-3-5-haiku-20241022"
  
# Parameter transformations for OpenRouter OpenAI models
parameters:
  "*":  # All OpenAI models
    "[max_tokens]": "max_completion_tokens"  # Rename parameter

# API configuration
api:
  base_url: "https://openrouter.ai/api"
  api_key: "$OPENROUTER_API_KEY"
  headers:
    "HTTP-Referer": "${APP_URL}"
    "X-Title": "ANTOMIX Proxy"