name: "Anthropic → Groq (GPT-OSS)"
description: "Uses Groq to route Anthropic requests to GPT-OSS-120B model"

# Model mappings
models:
  "claude-3-5-haiku-20241022": 
    - "openai/gpt-oss-120b"
  "claude-sonnet-4-20250514": 
    - "openai/gpt-oss-120b"
  "claude-opus-4-20250514": 
    - "openai/gpt-oss-120b"

# Claude code specific details
claude:
  fast_model: "claude-3-5-haiku-20241022"

# Parameter transformations for GPT-OSS model
parameters:
  "openai/gpt-oss-120b":
    "[max_tokens]": "max_completion_tokens"
    "max_completion_tokens": 16384
    # Dynamic reasoning_effort based on which Claude model was requested
    "reasoning_effort": "low"  # Default for haiku

# Model-specific parameter overrides
model_parameters:
  "claude-sonnet-4-20250514":
    "reasoning_effort": "medium"
  "claude-opus-4-20250514":
    "reasoning_effort": "high"

# API configuration
api:
  base_url: "https://api.groq.com/openai"
  api_key: "$GROQ_API_KEY"
  headers:
    # Custom headers if needed



