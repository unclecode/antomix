name: "Anthropic → Gemini"
description: "Route Anthropic requests to Google Gemini models"

# Model mappings
models:
  "claude-3-5-haiku-20241022": 
    - "google/gemini-2.0-flash-lite-001"
  "claude-opus-4-20250514": 
    - "google/gemini-2.5-pro"
  "claude-sonnet-4-20250514": 
    - "google/gemini-2.5-flash"

# Claude code specific details
claude:
  fast_model: "claude-3-5-haiku-20241022"
  
# Parameter transformations for Gemini models
parameters:
  "*":  # All Gemini models
    "[max_tokens]": "max_completion_tokens"  # Rename parameter

# API configuration
api:
  base_url: "https://openrouter.ai/api"
  api_key: "$OPENROUTER_API_KEY"
  headers:
    # Custom headers if needed