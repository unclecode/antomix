name: "Anthropic → OpenAI (GPT-5)"
description: "Uses OpenAI to route Anthropic requests to GPT-5 models with reasoning support"

# Model mappings
models:
  "claude-3-5-haiku-20241022": 
    - "gpt-4.1-mini"
  "claude-opus-4-1-20250805": 
    - "gpt-5"
  "claude-opus-4-20250514": 
    - "gpt-5"
  "claude-sonnet-4-20250514": 
    - "gpt-5"

# Claude code specific details
claude:
  fast_model: "claude-3-5-haiku-20241022"
  
# Parameter transformations for OpenAI models
parameters:
  "*":  # All OpenAI models
    "[max_tokens]": "max_completion_tokens"  # Rename parameter
  "gpt-5":
    "reasoning_effort": "minimal"  # Default for GPT-5
    "verbosity": "high"
    "max_completion_tokens": 100000

# Model-specific parameter overrides based on source Claude model
model_parameters:
  "claude-sonnet-4-20250514":
    "reasoning_effort": "minimal"
  "claude-opus-4-20250514":
    "reasoning_effort": "medium"
  "claude-opus-4-1-20250805":
    "reasoning_effort": "medium"

# API configuration
api:
  base_url: "https://api.openai.com"
  api_key: "$OPENAI_API_KEY"
  headers:
    # Custom headers if needed